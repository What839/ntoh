<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Manga — Reset Password</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap');
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#f8fbff;font-family:'Fredoka',sans-serif;color:#183b63;display:flex;align-items:center;justify-content:center;padding:24px}
.box{width:min(430px,100%);background:#fff;border:1px solid #dcecff;border-radius:28px;padding:28px;box-shadow:0 15px 40px rgba(70,130,190,.12)}
h1{margin:0 0 8px;font-size:32px}
p{color:#6f89a3;line-height:1.5}
label{display:block;margin:18px 0 7px;font-weight:600}
input{width:100%;padding:15px 16px;border:1px solid #dcecff;border-radius:16px;font:inherit;font-size:16px;outline:none}
button{width:100%;margin-top:20px;padding:15px;border:0;border-radius:16px;background:#70a9ed;color:#fff;font:600 17px 'Fredoka',sans-serif;cursor:pointer}
button:disabled{opacity:.6}
#msg{margin-top:14px;font-size:15px}
.small{font-size:13px;color:#8aa0b6}
</style>
</head>
<body>
<div class="box">
  <h1>Reset password</h1>
  <p>Choose a new password for your My Manga account.</p>
  <form id="form">
    <label>New password</label>
    <input id="pw" type="password" minlength="6" required placeholder="New password">
    <label>Confirm password</label>
    <input id="pw2" type="password" minlength="6" required placeholder="Confirm password">
    <button id="btn" type="submit">Update Password</button>
  </form>
  <div id="msg"></div>
  <p class="small">After updating it, return to the My Manga app and log in with the new password.</p>
</div>
<script>
const SUPABASE_URL="https://anjwxsqcvhpzoillktmy.supabase.co";
const SUPABASE_KEY="sb_publishable_pas11tpmdKbIMk8NyOTCRw_O0QAUPnt";
const params=new URLSearchParams(location.search);
const hash=new URLSearchParams(location.hash.slice(1));
const accessToken=hash.get("access_token") || params.get("access_token");

function setMsg(t,ok=false){
  const e=document.getElementById("msg");
  e.textContent=t;
  e.style.color=ok ? "#43885d" : "#b04d4d";
}

if(!accessToken){
  setMsg("This reset link is missing its recovery token. Please request a new password-reset email.");
  document.getElementById("btn").disabled=true;
}

document.getElementById("form").addEventListener("submit",async e=>{
  e.preventDefault();
  const p=document.getElementById("pw").value;
  const p2=document.getElementById("pw2").value;
  if(p!==p2){setMsg("The passwords do not match.");return}
  const btn=document.getElementById("btn");
  btn.disabled=true;
  setMsg("Updating password...",true);
  try{
    const r=await fetch(SUPABASE_URL+"/auth/v1/user",{
      method:"PUT",
      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer "+accessToken,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({password:p})
    });
    const data=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(data.message||data.error_description||"Password update failed.");
    setMsg("Password updated! You can now return to My Manga and log in.",true);
    document.getElementById("form").style.display="none";
  }catch(err){
    setMsg(err.message||"Something went wrong.");
    btn.disabled=false;
  }
});
</script>
</body>
</html>
